<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>퀴즈로 알아보는 정읍 · 진행자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 라인교육연구소(laain.kr) 팔레트 — 따뜻한 블랙 + 시그니처 옐로우 */
:root{
  --bg:#2c2c2a; --panel:#3a3a38; --panel2:#454541;
  --ink:#fdf2dc; --ink2:#a9a7a0; --ink3:#7c7a73;
  --yellow:#fdce0f; --deep:#8a7320; --cream:#fdf2dc;
  --fill:#fdf2dc; --fillInk:#2c2c2a;   /* 넓은 면 — 샛노랑 대신 크림 */
  --line:rgba(253,242,220,.14); --line2:rgba(253,242,220,.07);
  --beige:#ececec; --beigeInk:#3a3a38;   /* laain.kr 연그레이 — 설명 카드 */
  --no:#e8705f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

main{flex:1;min-height:0;padding:clamp(44px,7.4vh,110px) clamp(28px,4.5vw,90px) clamp(30px,4.4vh,66px);
  display:flex;flex-direction:column;overflow:hidden}

/* 배지 */
.badges{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:clamp(14px,2.2vh,30px);flex-wrap:wrap;flex:0 0 auto}
.badge{font-size:clamp(13px,1.35vw,20px);font-weight:600;padding:8px 20px;border-radius:999px;background:var(--panel);color:var(--ink2)}
.badge.num{background:var(--fill);color:var(--fillInk);font-weight:800}

/* 문제 */
.q{font-size:clamp(34px,4.7vw,82px);font-weight:800;line-height:1.28;letter-spacing:-.038em;
  text-align:center;margin-bottom:clamp(30px,5vh,74px);flex:0 0 auto}

/* 보기 — 가로 3등분 */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.8vw,34px);flex:0 0 auto}
.ch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,1.8vh,24px);
  background:var(--panel);border:2px solid transparent;border-radius:22px;
  padding:clamp(24px,3.8vh,54px) clamp(16px,1.5vw,28px);text-align:center;transition:.25s}
.ch .n{width:clamp(42px,3.4vw,62px);height:clamp(42px,3.4vw,62px);border-radius:50%;background:var(--panel2);
  display:grid;place-items:center;font-weight:800;font-size:clamp(19px,1.7vw,30px);color:var(--ink2)}
.ch .t{font-size:clamp(25px,2.9vw,54px);font-weight:700;letter-spacing:-.028em;line-height:1.24}
.ch .tally{font-size:clamp(14px,1.25vw,21px);font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
/* 공개 화면 — 정답과 설명에 자리를 몰아주려고 보기 결과는 왼쪽에 세로로 눕힌다 */
.choices.compact{grid-template-columns:1fr;gap:clamp(8px,1.2vh,14px)}
.choices.compact .ch{flex-direction:row;justify-content:space-between;gap:clamp(10px,1.1vw,18px);
  padding:clamp(10px,1.5vh,20px) clamp(14px,1.4vw,26px);border-radius:16px}
.choices.compact .ch .n{width:clamp(30px,2.2vw,42px);height:clamp(30px,2.2vw,42px);font-size:clamp(14px,1.2vw,21px)}
.choices.compact .ch .t{font-size:clamp(16px,1.6vw,29px);flex:1;text-align:left}
.ch.correct{background:var(--fill);border-color:var(--fill)}
.ch.correct .n{background:var(--fillInk);color:var(--fill)}
.ch.correct .t,.ch.correct .tally{color:var(--fillInk)}
.ch.dimmed{opacity:.4}

/* 보기 아래 여백 + 제출 현황 — 넉넉하고 크게 */
.foot{margin-top:auto;padding-top:clamp(22px,4vh,76px);flex:0 0 auto}
.tmeta{display:flex;justify-content:center}
.tstat{font-size:clamp(21px,2.1vw,38px);font-weight:700;color:var(--ink2)}
.tstat b{color:var(--yellow)}
.tstat.done{color:var(--yellow)}

/* 팀 원 — 5칸을 가로로 꽉 채워 2줄 */
/* 5칸을 가로로 꽉 채우되, 두 줄이 화면 높이를 넘지 않도록 vh로도 상한을 건다 */
.chips{display:grid;grid-template-columns:repeat(5,1fr);
  gap:clamp(10px,1.5vh,22px) clamp(12px,1.4vw,24px);
  width:100%;max-width:min(clamp(400px,58vw,860px), 59vh);
  margin:clamp(18px,2.8vh,44px) auto 0;flex:0 0 auto}
.chip{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
  background:var(--panel);color:var(--ink3);
  font-weight:800;font-size:clamp(19px,1.9vw,34px);letter-spacing:-.02em;transition:.2s}
.chip.on{background:var(--yellow);color:#2c2c2a}               /* 접속함 — 한눈에 보이게 */
.chip.done{background:var(--fill);color:var(--fillInk)}        /* 제출함 · 정답 */
.chip.wrong{background:var(--panel2);color:var(--no);box-shadow:inset 0 0 0 3px var(--no)}
.chip .mk{position:absolute;top:2%;right:2%;width:30%;height:30%;
  border-radius:50%;display:grid;place-items:center;font-size:clamp(12px,1.05vw,20px);font-weight:800;
  background:var(--yellow);color:#2c2c2a;border:3px solid var(--bg)}
.chip .mk.x{background:var(--no);color:#2c2c2a}
.chip .mk.none{background:var(--panel2);color:var(--ink3)}

/* 정답 공개 */
.rbottom{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(22px,3vw,56px);
  flex:1;min-height:0;margin-top:clamp(10px,1.6vh,26px)}
.rleft{display:flex;flex-direction:column;min-height:0;gap:clamp(12px,1.8vh,24px)}
.rtitle{font-size:clamp(13px,1.2vw,19px);font-weight:700;color:var(--ink3);letter-spacing:.02em;flex:0 0 auto}
.expl{font-size:clamp(16px,1.5vw,27px);line-height:1.62;color:var(--ink);flex:1;min-height:0;overflow:auto}
.src{font-size:clamp(12px,1.05vw,16px);color:var(--ink3);margin-top:12px;font-weight:500}
.rbottom .chips{margin:0;max-width:min(100%, 46vh);gap:clamp(8px,1.2vh,14px) clamp(9px,1vw,16px)}
.rbottom .chip{font-size:clamp(14px,1.25vw,23px)}

/* 정답 — 우측 가운데 정렬, 크게. 정답은 찐노랑, 설명은 연베이지로 나눈다 */
.rright{display:flex;flex-direction:column;min-height:0;gap:clamp(10px,1.6vh,20px)}
.answer{background:var(--yellow);color:#2c2c2a;border-radius:24px;
  padding:clamp(16px,2.4vh,34px) clamp(20px,2vw,40px);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:clamp(8px,1.2vh,16px);flex:0 0 auto}
.answer .lb{font-size:clamp(12px,1.15vw,18px);font-weight:800;letter-spacing:.2em;color:rgba(44,44,42,.55)}
.answer .v{font-size:clamp(28px,3.2vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1.15}
.answer .hl{font-size:clamp(16px,1.55vw,28px);font-weight:800;line-height:1.35;
  border-top:2px solid rgba(44,44,42,.22);padding-top:clamp(8px,1.2vh,16px);width:100%}
.why{background:var(--beige);color:var(--beigeInk);border-radius:24px;
  padding:clamp(16px,2.2vh,32px) clamp(20px,2vw,38px);
  font-size:clamp(22px,min(2.5vw,4.3vh),46px);line-height:1.5;font-weight:500;letter-spacing:-.02em;
  flex:1;min-height:0;overflow:auto;text-align:left}
.why p+p{margin-top:clamp(7px,1.1vh,18px)}
.why .src{font-size:clamp(12px,1.1vw,17px);color:rgba(58,58,56,.5);margin-top:clamp(10px,1.5vh,20px);font-weight:600}

/* 대기화면 */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:clamp(34px,5vw,90px);align-items:center;flex:1;min-height:0}
.qrbox{background:#fff;border-radius:24px;padding:clamp(14px,1.4vw,22px);line-height:0}
.qrbox img{width:clamp(260px,28vw,480px);display:block}
.lobby h2{font-size:clamp(38px,5.2vw,96px);font-weight:800;letter-spacing:-.04em;line-height:1.22;margin-bottom:clamp(14px,2.2vh,30px)}
.lobby h2 span{color:var(--yellow)}
.urlbox{display:flex;gap:10px;align-items:center;margin:18px 0 24px}
.urlbox input{flex:1;max-width:600px;background:var(--panel);border:2px solid transparent;color:var(--ink);border-radius:12px;
  padding:14px 20px;font:inherit;font-size:clamp(15px,1.35vw,21px);font-weight:600}
.urlbox input:focus{outline:none;border-color:var(--yellow)}
.lsub{font-size:clamp(19px,2.1vw,38px);color:var(--ink2);font-weight:600;margin-bottom:clamp(8px,1.2vh,16px)}
.lsub b{color:var(--yellow)}
.lobby .chips{margin:clamp(12px,2vh,24px) 0 0;max-width:min(100%,430px);
  gap:clamp(7px,1vh,12px) clamp(8px,.8vw,13px)}
.lobby .chip{font-size:clamp(14px,1.2vw,22px)}

/* 마무리 */
.outro{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(16px,3vh,40px)}
.outro h2{font-size:clamp(36px,4.6vw,80px);font-weight:800;letter-spacing:-.04em;color:var(--yellow);margin-bottom:clamp(8px,1.6vh,22px)}
.outro p{font-size:clamp(28px,3.6vw,62px);font-weight:600;line-height:1.36;letter-spacing:-.03em;color:var(--ink)}
.outro p:last-child{color:var(--yellow);font-weight:800}

/* 순위 */
.rank{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(6px,.9vh,13px) clamp(20px,2.8vw,50px);align-content:start;overflow:auto}
.row{display:flex;align-items:center;gap:clamp(12px,1.3vw,22px);padding:clamp(12px,1.9vh,32px) clamp(16px,1.7vw,30px);
  background:var(--panel);border-radius:18px}
.row .r{flex:0 0 auto;min-width:clamp(56px,4.6vw,82px);font-size:clamp(22px,2.2vw,38px);font-weight:800;color:var(--ink3);letter-spacing:-.03em}
.row .tm{font-size:clamp(24px,2.4vw,42px);font-weight:800;white-space:nowrap}
.row .ag{font-size:clamp(12px,1.1vw,17px);color:var(--ink3);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-size:clamp(36px,3.7vw,66px);font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1}
.row .sc small{font-size:.42em;color:var(--ink3);font-weight:600}
.row.p1{background:var(--fill)}
.row.p1 .r,.row.p1 .sc,.row.p1 .tm{color:var(--fillInk)}
.row.p1 .ag{color:rgba(44,44,42,.6)}
.row.p2,.row.p3{background:var(--panel2)}
.row.p2 .r,.row.p3 .r{color:var(--cream)}

/* 조작 바 */
.ctl{flex:0 0 auto;padding:12px 22px;border-top:1px solid var(--line2);background:#252523}
.ctl.hidden{display:none}
.row1,.row2{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row2{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.ctl.more .row2{display:flex}
.ctl .sp{flex:1}
.pill{font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--panel);padding:8px 15px;border-radius:999px;white-space:nowrap}
.pill b{color:var(--yellow);font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:var(--no);display:inline-block;margin-right:7px}
.dot.live{background:var(--yellow)}

button{font:inherit;font-weight:600;font-size:15px;border-radius:11px;border:none;background:var(--panel);color:var(--ink);
  padding:12px 18px;cursor:pointer;transition:.15s;white-space:nowrap}
button:hover{background:var(--panel2)}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--yellow);color:#2c2c2a;font-weight:800;font-size:17px;padding:13px 32px}
button.primary:hover{background:#ffd93a}
button.primary.ready{animation:ready 1.3s ease-in-out infinite}
@keyframes ready{50%{opacity:.55}}
button.ghost{background:transparent;color:var(--ink2)}
button.danger{background:transparent;color:var(--no)}
select{font:inherit;font-weight:600;font-size:14.5px;background:var(--panel);color:var(--ink);border:none;border-radius:11px;padding:12px 13px;width:250px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:600;cursor:pointer;user-select:none}
.tog input{width:17px;height:17px;accent-color:var(--yellow)}
.hint{font-size:12.5px;color:var(--ink3);font-weight:500}

/* 조작 바를 감춘 상태에서도 연결이 끊기면 반드시 보이게 */
#alert{position:fixed;top:18px;right:22px;z-index:30;display:none;
  background:var(--no);color:#2c2c2a;padding:10px 20px;border-radius:999px;font-size:15px;font-weight:800}
body.offline #alert{display:block}
</style>
</head>
<body>

<div id="alert">연결 끊김 · 재연결 중</div>

<main id="stage"></main>

<div class="ctl" id="ctl">
  <div class="row1">
    <button id="bPrimary" class="primary">문제 출제</button>
    <button id="bPrev" title="이전 문제">◀</button>
    <select id="sel" autocomplete="off"></select>
    <button id="bNext" title="다음 문제">▶</button>
    <div class="sp"></div>
    <span class="pill" id="pProg"></span>
    <span class="pill"><span class="dot" id="dot"></span><span id="connTxt">연결 중</span></span>
    <button id="bFs">⛶ 전체화면</button>
    <button id="bMore" class="ghost">⋯ 더보기</button>
  </div>
  <div class="row2" id="row2">
    <button id="bLobby" class="ghost">대기화면</button>
    <button id="bFinal" class="ghost">최종 순위</button>
    <button id="bRq" class="danger">이 문제 답 초기화</button>
    <button id="bRa" class="danger">전체 초기화</button>
    <div class="sp"></div>
    <span class="hint">Space 진행 · ←→ 문제 이동 · F 전체화면 · H 이 줄 숨김</span>
  </div>
</div>

<script>
const K = new URLSearchParams(location.search).get('k');
const $ = s => document.querySelector(s);
const stage = $('#stage');
let S = null;
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// 해설을 문장 단위로 끊어 한 줄씩 보여준다 (따옴표 안의 마침표는 문장 끝으로 보지 않는다)
const sentences = t => String(t??'').split(/(?<=[.?!])\s+(?=[^\s])/)
  .filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('');

/* ---- 통신 ---- */
const SQ = 'role=host&k='+encodeURIComponent(K);

function offline(bad){
  document.body.classList.toggle('offline', bad);
  $('#dot').className = bad ? 'dot' : 'dot live';
  $('#connTxt').textContent = bad ? '재연결 중' : '연결됨';
}

const refresh = ()=>fetch('/api/state?'+SQ).then(r=>r.json()).then(apply)
  .catch(()=>{ offline(true); });

function post(action, body){
  return fetch('/api/host/'+action,{method:'POST',headers:{'content-type':'application/json','x-host-key':K},body:JSON.stringify(body||{})}).then(r=>{ refresh(); return r; });
}

// render()가 끝까지 성공했을 때만 시그니처를 기록한다.
// 그리지 못한 상태를 "처리했다"고 표시하면 화면이 그대로 멈추기 때문이다.
let renderedSig='';
function apply(d){
  S=d;
  offline(false);
  const sig=JSON.stringify(d,(k,v)=>k==='serverNow'?0:v);
  if(sig===renderedSig) return;   // 변화가 없으면 다시 그리지 않는다 (입력 포커스 유지)
  try{ render(); renderedSig=sig; }
  catch(e){ renderedSig=''; console.error('render 실패, 다음 갱신에서 재시도', e); }
}

// 프록시가 스트림을 막는 환경(터널 등)에서는 자동으로 폴링으로 전환한다
function connect(){
  let got=false, poll=null;
  const startPoll = ()=>{ if(!poll) poll = setInterval(refresh, 600); };
  const es = new EventSource('/api/stream?'+SQ);
  es.onerror = ()=>{ if(got){ offline(true); } else { es.close(); startPoll(); } };
  es.onmessage = e => { got=true; apply(JSON.parse(e.data)); };
  setTimeout(()=>{ if(!got){ es.close(); startPoll(); } }, 2500);
  refresh();
}

/* ---- 참여 주소 ---- */
// QR은 지금 진행자 화면을 연 주소를 그대로 쓴다.
// 터널 주소로 진행자 화면을 열면 QR도 자동으로 그 주소가 되므로 따로 손댈 일이 없다.
const DEFAULT_JOIN_URL = location.origin + '/';
// 직접 입력해 둔 주소가 있어도, 지금 페이지와 도메인이 다르면 지난 행사의 죽은 주소이므로 버린다
function initialJoinUrl(){
  const saved = localStorage.getItem('joinUrl3');
  if(!saved) return DEFAULT_JOIN_URL;
  try{ if(new URL(saved).origin !== location.origin) return DEFAULT_JOIN_URL; }
  catch{ return DEFAULT_JOIN_URL; }
  return saved;
}
let joinUrl = initialJoinUrl();
function setJoinUrl(u){ joinUrl = u; localStorage.setItem('joinUrl3', u); renderedSig=''; render(); }

/* ---- 참여/제출 집계 ----
   접속하지 않은 팀은 기다리지 않는다. 기권이 있을 수 있으므로
   분모는 항상 "실제로 들어온 팀" 수로 잡는다. */
function joinedTeams(){ return (S.joined||[]).filter(n=>S.teams.some(t=>t.no===n)); }
function allAnswered(){
  const j = joinedTeams();
  return j.length>0 && j.every(n=>S.answeredTeams.includes(n));
}

/* ---- 그리기 ---- */
function render(){
  if(!S) return;
  const it = S.item;
  $('#pProg').innerHTML = S.phase==='final' ? '최종 순위'
    : S.phase==='outro' ? '마무리'
    : it ? (it.scored ? `문제 <b>${it.order}</b> / ${S.scoredTotal}` : '연습문제')
    : `참여 <b>${joinedTeams().length}</b> / ${S.teams.length}`;

  buildSelect();
  updateButtons();

  if(S.phase==='lobby'){ stage.innerHTML = viewLobby(); wireLobby(); }
  else if(S.phase==='outro') stage.innerHTML = viewOutro();
  else if(S.phase==='final') stage.innerHTML = viewFinal();
  else if(S.revealed) stage.innerHTML = viewReveal();
  else stage.innerHTML = viewQuestion();

  fitExplanation();
}

// 해설 길이가 문항마다 달라 잘릴 수 있다. 카드 안에 들어갈 때까지 글자를 조금씩 줄인다.
function fitExplanation(){
  const w = $('.why');
  if(!w) return;
  const base = parseFloat(getComputedStyle(w).fontSize);
  for(let px = base; px >= 14 && w.scrollHeight > w.clientHeight; px -= 0.5){
    w.style.fontSize = px + 'px';
  }
}

// 팀 원 하나. state: 'off' | 'on' | 'done' | 'wrong', mark: null | 'check' | 'O' | 'X' | '–'
function chip(t, state, mark){
  const mk = mark==='check' ? `<span class="mk">✓</span>`
    : mark==='O' ? `<span class="mk">O</span>`
    : mark==='X' ? `<span class="mk x">X</span>`
    : mark==='–' ? `<span class="mk none">–</span>` : '';
  return `<div class="chip ${state}">${esc(t.label)}${mk}</div>`;
}

function viewLobby(){
  const joined = joinedTeams();
  const chips = S.teams.map(t=>chip(t, joined.includes(t.no)?'on':'', null)).join('');
  return `<div class="lobby">
    <div class="qrbox"><img src="/qr.svg?d=${encodeURIComponent(joinUrl)}" alt="QR"></div>
    <div>
      <h2>휴대폰으로 <span>QR</span>을 찍고<br>우리 테이블 번호를 눌러주세요</h2>
      <div class="lsub">테이블당 한 분만 접속하시면 됩니다</div>
      <div class="urlbox"><input id="uin" value="${esc(joinUrl)}"><button id="uset">주소 적용</button></div>
      <div class="lsub">접속한 팀 <b>${joined.length}</b> / ${S.teams.length}</div>
      <div class="chips">${chips}</div>
    </div>
  </div>`;
}
function wireLobby(){
  const i=$('#uin'); if(!i) return;
  $('#uset').onclick=()=>setJoinUrl(i.value.trim());
  i.onkeydown=e=>{ if(e.key==='Enter') setJoinUrl(i.value.trim()); };
}

function badges(it){
  return `<div class="badges">
    ${it.scored?`<span class="badge num">Q${it.order}</span>`:`<span class="badge num">연습문제</span>`}
    ${it.agenda?`<span class="badge">의제 ${it.agendaNo}. ${esc(it.agenda)}</span>`:''}
    ${it.tableLabel?`<span class="badge">${esc(it.tableLabel)} 테이블 문제</span>`:''}
  </div>`;
}

function viewQuestion(){
  const it=S.item;
  const ch = it.choices.map((c,i)=>
    `<div class="ch"><div class="n">${i+1}</div><div class="t">${esc(c)}</div></div>`).join('');
  // 답을 제출한 팀에는 체크 표시
  const chips = S.teams.map(t=>{
    const a=S.answeredTeams.includes(t.no);
    return chip(t, a?'done':joinedTeams().includes(t.no)?'on':'', a?'check':null);
  }).join('');
  const n = S.answeredTeams.length;
  const stat = n === 0 ? `<div class="tstat">답변을 기다리는 중</div>`
    : n === S.teams.length ? `<div class="tstat done">전체 제출 완료!</div>`
    : `<div class="tstat"><b>${n}</b>팀 제출 완료${S.open?'':' · 마감됨'}</div>`;
  return `${badges(it)}
  <div class="q">${esc(it.question)}</div>
  <div class="choices">${ch}</div>
  <div class="foot">
    <div class="tmeta">${stat}</div>
    <div class="chips">${chips}</div>
  </div>`;
}

function viewReveal(){
  const it=S.item, r=S.reveal;
  const total = Math.max(1, r.tally.reduce((a,b)=>a+b,0));
  const ch = it.choices.map((c,i)=>{
    const ok=i===r.answerIndex;
    return `<div class="ch ${ok?'correct':'dimmed'}"><div class="n">${i+1}</div><div class="t">${esc(c)}</div>
      <div class="tally">${r.tally[i]}팀 · ${Math.round(r.tally[i]/total*100)}%</div></div>`;
  }).join('');
  const chips = S.teams.map(t=>{
    const x=r.results.find(v=>v.team===t.no);
    if(x.choice===null) return chip(t,'','–');
    return chip(t, x.correct?'done':'wrong', x.correct?'O':'X');
  }).join('');
  const okCount = r.results.filter(v=>v.correct).length;
  return `${badges(it)}
  <div class="rbottom">
    <div class="rleft">
      <div class="choices compact">${ch}</div>
      <div class="rtitle">팀별 결과 · 정답 ${okCount}팀</div>
      <div class="chips">${chips}</div>
    </div>
    <div class="rright">
      <div class="answer">
        <div class="lb">정 답</div>
        <div class="v">${esc(r.answerLabel)}</div>
        <div class="hl">${esc(r.highlight)}</div>
      </div>
      <div class="why">${sentences(r.explanation)}<div class="src">출처 · ${esc(r.source)}</div></div>
    </div>
  </div>`;
}

function viewOutro(){
  const o=S.outro;
  return `<div class="outro"><h2>${esc(o.title)}</h2>${o.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
}

function viewFinal(){
  const rows = (S.ranking||[]).map(r=>`
    <div class="row ${r.rank<=3?'p'+r.rank:''}">
      <div class="r">${r.rank}위</div>
      <div class="tm">${esc(r.label)}</div>
      <div class="ag">${esc(r.agenda)}</div>
      <div class="sc">${r.score}<small> / ${S.scoredTotal}</small></div>
    </div>`).join('');
  return `<div class="badges"><span class="badge num">최종 순위</span><span class="badge">${S.scoredTotal}문제 기준</span></div>
  <div class="rank">${rows}</div>`;
}

/* ---- 조작 ---- */
function buildSelect(){
  const sel=$('#sel');
  const sig=(S.list||[]).map(l=>l.index+':'+l.answered).join('|');
  if(sel.dataset.sig!==sig){
    sel.dataset.sig=sig;
    sel.innerHTML=(S.list||[]).map(l=>
      `<option value="${l.index}">${esc(l.label.slice(0,40))}${l.answered?` (${l.answered}팀 응답)`:''}</option>`).join('');
  }
  sel.value = S.index<0 ? '' : String(S.index);
}

// 진행은 두 단계뿐 — 정답 공개 → 다음 문제.
// 문제는 고르는 순간 열리고, 정답 공개를 누르는 순간 답변이 마감된다.
function updateButtons(){
  const it=S.item, quiz = S.phase==='quiz' && it;
  const b=$('#bPrimary'), done = quiz && allAnswered();
  if(!quiz) b.textContent = S.phase==='final'?'마무리 문구':S.phase==='outro'?'대기화면으로':'퀴즈 시작';
  else if(S.revealed) b.textContent = S.index>=S.total-1 ? '최종 순위' : '다음 문제';
  else b.textContent = '정답 공개';
  b.classList.toggle('ready', !!(quiz && !S.revealed && done));
}

function primary(){
  if(!S) return;
  const it=S.item;
  if(S.phase==='final'){ post('outro'); return; }
  if(S.phase==='outro'){ post('lobby'); return; }
  if(S.phase!=='quiz' || !it){ post('select',{index:0}); return; }
  if(S.revealed){ post('next'); return; }
  post('reveal');
}

/* ---- 전체화면(무대 모드) ---- */
let stageMode = false;
function setStage(on){
  stageMode = on;
  document.body.classList.toggle('fs', on);
  $('#bFs').textContent = on ? '⛶ 전체화면 끄기' : '⛶ 전체화면';
}
function toggleFs(){
  const on = !stageMode;
  setStage(on);
  if(on){ const r=document.documentElement.requestFullscreen; if(r) r.call(document.documentElement).catch(()=>{}); }
  else if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

$('#bPrimary').onclick=primary;
$('#bFs').onclick=toggleFs;
$('#bMore').onclick=()=>$('#ctl').classList.toggle('more');
$('#bLobby').onclick=()=>post('lobby');
$('#bPrev').onclick=()=>post('prev');
$('#bNext').onclick=()=>post('next');
$('#bFinal').onclick=()=>post('final');
$('#bRq').onclick=()=>{ if(confirm('이 문제의 팀 답변을 모두 지웁니다. 진행할까요?')) post('resetQuestion'); };
$('#bRa').onclick=()=>{ if(confirm('답변·점수·접속한 팀까지 모두 지웁니다. 정말 초기화할까요?')) post('resetAll'); };
// 새로고침하면 브라우저가 드롭다운의 이전 값을 복원하면서 change를 쏘는 경우가 있다.
// 지금 문제와 같은 값이면 무시해야 엉뚱한 문제로 튀지 않는다.
$('#sel').onchange=e=>{
  const i=Number(e.target.value);
  if(!S || i===S.index || Number.isNaN(i)) return;
  post('select',{index:i});
};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); primary(); }
  else if(e.key==='ArrowRight') post('next');
  else if(e.key==='ArrowLeft') post('prev');
  else if(e.key==='f'||e.key==='F') toggleFs();
  else if(e.key==='Escape' && stageMode) setStage(false);
  else if(e.key==='h'||e.key==='H') $('#ctl').classList.toggle('hidden');
});

connect();
</script>
</body>
</html>
